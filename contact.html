<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お問合せ ｜ とうじょうRMO</title>
<meta name="description" content="とうじょうRMOへのご質問・ご相談、活動へのご参加はこちらから。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero">
  <img src="images/hero4.jpg" alt="東条地域の農村風景">
  <div class="wrap"><span class="eyebrow">Contact</span><h1>お問合せ</h1></div>
</section>
<div class="crumbs"><div class="wrap"><a href="index.html">HOME</a> ／ お問合せ</div></div>
<article class="article">
  <div class="wrap" style="max-width:820px;">
    <div class="reveal">
      <p>とうじょうRMOへのご質問・ご相談、活動へのご参加のお申し込みは、以下のフォームまたは連絡先へお願いいたします。</p>
    </div>
    <div class="reveal">
      <h2>お問合せフォーム</h2>
      <form class="form" onsubmit="return submitForm(event)">
        <label>お名前<span style="color:var(--gold)"> *</span>
          <input type="text" name="name" required placeholder="山田 太郎">
        </label>
        <label>メールアドレス<span style="color:var(--gold)"> *</span>
          <input type="email" name="email" required placeholder="example@mail.com">
        </label>
        <label>お問合せ内容<span style="color:var(--gold)"> *</span>
          <textarea name="message" required placeholder="ご質問・ご相談内容をご記入ください。"></textarea>
        </label>
        <button type="submit" class="btn">送信する →</button>
      </form>
    </div>
    <div class="reveal">
      <h2>連絡先</h2>
      <div class="contact-info">
        <div class="row"><b>団体名</b><span>とうじょうRMO</span></div>
        <div class="row"><b>所在地</b><span>兵庫県加東市 東条地域（岡本・森・南山）</span></div>
        <div class="row"><b>Web</b><span><a href="https://www.welovetojo.com/" target="_blank" rel="noopener" style="color:var(--green)">We Love シン東条</a></span></div>
        <div class="row"><b>SNS</b><span><a href="https://www.instagram.com/kato.agri.japan/" target="_blank" rel="noopener" style="color:var(--green)">Instagram @kato.agri.japan</a></span></div>
      </div>
    </div>
    <a href="index.html" class="back-link">← トップへ戻る</a>
  </div>
</article>
<div id="site-footer"></div>
<script src="common.js"></script>
<script>
/* デモ用：送信処理は未接続です。実運用ではメール送信サービス等に接続してください。 */
function submitForm(e){
  e.preventDefault();
  alert('お問合せありがとうございます。\n（このフォームはデモです。送信先の設定を行ってください。）');
  e.target.reset();
  return false;
}
</script>
</body>
</html>
